name: waweb
description: Aplikasi WhatsApp Web native untuk Android.
publish_to: none
version: 0.1.0-beta+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1

flutter:
  uses-material-design: true
