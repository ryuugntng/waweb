name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis"
        required: true
        default: "v0.1.0-beta"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.aether --project-name waweb _gen
          cp -r _gen/android ./android
          rm -rf _gen
          rm -rf android/app/src/main/res/mipmap-*
          cp -r android_overlay/. android/
          sed -i -E 's/minSdk(Version)? ?=? ?flutter\.minSdkVersion/minSdk = 29/' android/app/build.gradle*
          grep -n "minSdk" android/app/build.gradle*

      - name: Dependencies
        run: |
          flutter pub get
          grep -rl "proguard-android.txt" "$PUB_CACHE/hosted" --include=build.gradle --include=build.gradle.kts 2>/dev/null | xargs -r sed -i "s/proguard-android\\.txt/proguard-android-optimize.txt/g"

      - name: Build APK
        run: flutter build apk --release --split-per-abi --no-shrink

      - name: Collect APK
        run: |
          mkdir out
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            b=$(basename "$f" .apk)
            cp "$f" "out/waweb-BETA-${b#app-}.apk"
          done
          ls -lh out

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: waweb BETA ${{ steps.tag.outputs.name }}
          prerelease: true
          generate_release_notes: true
          files: out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: waweb-apk
          path: out/*.apk
